name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amparo
          POSTGRES_PASSWORD: ci-apenas
          POSTGRES_DB: amparo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amparo -d amparo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Segredos descartáveis, gerados só para esta execução. Nunca se usam segredos verdadeiros no CI.
      - name: Criar o .env de teste
        run: |
          cat > .env <<EOF
          NODE_ENV=test
          PORT=3000
          POSTGRES_USER=amparo
          POSTGRES_PASSWORD=ci-apenas
          POSTGRES_DB=amparo
          DATABASE_URL=postgres://amparo:ci-apenas@127.0.0.1:5432/amparo
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\r\n')
          EMAIL_PEPPER=$(openssl rand -base64 48 | tr -d '\r\n')
          EMAIL_ENC_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\r\n')
          PROFILE_MASTER_KEY=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\r\n')
          EOF

      - run: npm run migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Só falha com vulnerabilidades altas ou críticas nas dependências de produção.
      - run: npm audit --omit=dev --audit-level=high

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem de produção
        run: docker build -f backend/Containerfile -t amparo-api:ci backend
      - name: A imagem não corre como root
        run: test "$(docker run --rm --entrypoint id amparo-api:ci -un)" = "node"

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar os scripts de deploy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck deploy/backup.sh deploy/restore-test.sh
